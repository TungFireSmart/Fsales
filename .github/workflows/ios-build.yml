name: iOS Build

on:
  push:
    branches:
      - main
    paths:
      - "FsalesIOS/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "FsalesIOS/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build FsalesIOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project FsalesIOS/FsalesIOS.xcodeproj \
            -scheme FsalesIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
